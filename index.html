<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>HTML Grabber</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#111;
  color:#fff;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  padding:20px;
}

h1{
  font-size:24px;
  margin:0 0 15px;
}

textarea{
  width:100%;
  min-height:130px;
  background:#1c1c1c;
  color:#fff;
  border:1px solid #444;
  border-radius:12px;
  padding:14px;
  font-size:16px;
  outline:none;
  resize:vertical;
}

textarea:focus{
  border-color:#777;
}

button{
  width:100%;
  margin-top:12px;
  padding:15px;
  border:0;
  border-radius:12px;
  background:#fff;
  color:#000;
  font-size:16px;
  font-weight:600;
}

button:active{
  transform:scale(.98);
}

#status{
  margin-top:15px;
  color:#aaa;
  font-size:14px;
}

#result{
  margin-top:15px;
  width:100%;
  min-height:400px;
  background:#080808;
  border:1px solid #333;
  border-radius:12px;
  padding:14px;
  color:#ddd;
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
  font-size:13px;
  line-height:1.5;
  white-space:pre-wrap;
  overflow:auto;
}
</style>
</head>

<body>

<h1>HTML Grabber</h1>

<textarea
  id="url"
  placeholder="Вставь сюда ссылку на сайт&#10;&#10;Например: https://example.com"
></textarea>

<button onclick="getSite()">
  Получить код сайта
</button>

<div id="status"></div>

<pre id="result"></pre>

<script>

async function getSite(){

  const input = document.getElementById("url");
  const status = document.getElementById("status");
  const result = document.getElementById("result");

  let url = input.value.trim();

  if(!url){
    status.textContent = "Вставь ссылку на сайт.";
    return;
  }

  if(!/^https?:\/\//i.test(url)){
    url = "https://" + url;
  }

  status.textContent = "Загружаю страницу...";
  result.textContent = "";

  try{

    const response = await fetch(url, {
      method:"GET"
    });

    if(!response.ok){
      throw new Error(
        "HTTP " + response.status
      );
    }

    const html = await response.text();

    status.textContent =
      "Готово. Получено символов: " + html.length;

    result.textContent = html;

  }catch(error){

    status.textContent =
      "Не удалось получить сайт.";

    result.textContent =
      "Ошибка:\n\n" +
      error.message +
      "\n\n" +
      "Скорее всего сайт запрещает запросы из браузера (CORS).";

  }

}

</script>

</body>
</html>
